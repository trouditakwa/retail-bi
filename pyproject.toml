[project]
name = "retail-bi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "takwa", email = "takwatroudi0@gmailcom" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
